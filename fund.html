<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f4f">
  <meta name="robots" content="noindex">
  <title>펀드 주문 받기</title>
  <link rel="icon" href="images/app-icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body class="admin fund-page">
  <header class="topbar">
    <div class="logo-slot" aria-label="로고 자리">로고<br>자리</div>
    <div class="topbar-title">
      <h1>펀드 주문 받기</h1>
      <p class="sub" id="who"></p>
    </div>
    <button id="outBtn" class="btn on-dark small hidden">로그아웃</button>
  </header>

  <div id="banners"></div>
  <section id="gate" class="gate"></section>

  <div id="app" class="hidden">
    <nav class="tabs" id="nav">
      <button class="tab active" data-tab="orders">주문 <span id="newCount" class="count hidden"></span></button>
      <button class="tab" data-tab="walkup">현장 주문</button>
      <button class="tab" data-tab="menu">메뉴·품절</button>
      <button class="tab" data-tab="accounting">회계 정리</button>
      <button class="tab" data-tab="stats">매출</button>
      <button class="tab" data-tab="settings">운영</button>
    </nav>
    <main>
      <section id="tab-orders"></section>
      <section id="tab-walkup" class="hidden"></section>
      <section id="tab-menu" class="hidden"></section>
      <section id="tab-accounting" class="hidden"></section>
      <section id="tab-stats" class="hidden"></section>
      <section id="tab-settings" class="hidden"></section>
    </main>
  </div>

  <script type="module" src="js/fund.js"></script>
</body>
</html>
